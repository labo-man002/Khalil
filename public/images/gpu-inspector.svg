<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Two synthetic nodes each have two free GPU units; four free units do not provide a four-unit single-node fit"><rect width="800" height="520" fill="#f0f1e7"/><text x="65" y="75" font-family="monospace" font-size="14" letter-spacing="2" fill="#647064">GPU WORKLOAD INSPECTOR / SYNTHETIC SCENARIO</text><g fill="#f7f5ef" stroke="#9aaa8b" stroke-width="2"><rect x="80" y="125" width="285" height="220" rx="12"/><rect x="435" y="125" width="285" height="220" rx="12"/></g><g font-family="Georgia,serif" fill="#233329" font-size="27"><text x="105" y="170">Node A</text><text x="460" y="170">Node B</text></g><g stroke="#829577" stroke-width="1.5"><rect x="107" y="205" width="48" height="65" rx="5" fill="#71906a"/><rect x="166" y="205" width="48" height="65" rx="5" fill="#71906a"/><rect x="225" y="205" width="48" height="65" rx="5" fill="#e5eadb"/><rect x="284" y="205" width="48" height="65" rx="5" fill="#e5eadb"/><rect x="462" y="205" width="48" height="65" rx="5" fill="#71906a"/><rect x="521" y="205" width="48" height="65" rx="5" fill="#71906a"/><rect x="580" y="205" width="48" height="65" rx="5" fill="#e5eadb"/><rect x="639" y="205" width="48" height="65" rx="5" fill="#e5eadb"/></g><g font-family="monospace" font-size="14" fill="#647064"><text x="107" y="315">2 allocated / 2 free</text><text x="462" y="315">2 allocated / 2 free</text></g><path d="M220 365V390H577V365" stroke="#8a9c7d" stroke-width="1.5" fill="none"/><text x="400" y="438" text-anchor="middle" font-family="Georgia,serif" font-size="29" fill="#42624b">4 free GPUs ≠ a single-node fit</text><text x="400" y="478" text-anchor="middle" font-family="monospace" font-size="12" fill="#718067">COUNT FIT IS ONE PART OF FEASIBILITY</text></svg>

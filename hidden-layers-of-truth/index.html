{id:"intro",place:"دار سامي · 23:43",bg:"room",speaker:"الراوي",text:"الخميس، قبل نصّ الليل بشويّة. شتاء، شتا خفيفة، والمدينة ساكتة.\nسامي خدم نهار كامل على ملفّ تبرّعات لجمعية «الجسر». غدوة لازم يبعثوه للسبونسور.",next:"phone"},
{id:"phone",place:"دار سامي · 23:47",bg:"room",speaker:"سامي",text:"«بعثت لآدم من التسعة باش يثبّتلي الأرقام... شاف الميساج وما جاوبش.»\nتحلّ إنستغرام. آدم عامل ستوري مع صحابو، ويوسف قاعد معاه.",next:"lina",evidence:"آدم شاف الميساج وما جاوبش؛ وفي ستوري مع يوسف."},
{id:"lina",place:"دار سامي · 23:51",bg:"room",speaker:"لينا · ميساج",text:"«سامي، بالله ما تبعثش التقرير الليلة. ثمّة حاجة لازم نحكيو فيها غدوة.»\nتبدا تكتب ردّ... لكن لينا تولّي أوفلاين.",next:"j1",evidence:"لينا حذّرت من إرسال التقرير من غير ما تفسّر."},
{id:"j1",kind:"judgment",place:"دار سامي",bg:"room",speaker:"صوت سامي الداخلي",text:"تلقى روحك تربط في أحداث ما تعرفش إذا عندها علاقة ببعضها.",question:"شنوّة أقرب تفسير عندك توّة؟",choices:[["exclude","آدم ويوسف يحبّوا يقصّوني من الموضوع."],["careless","آدم يمكن مهمل، أما هذا ما يثبتش نيّتو."],["report","كلام لينا يخلّيني نشكّ اللي ثمّة مشكلة حقيقية في التقرير."],["unknown","ما عنديش معطيات كافية باش نحكم."]],next:"morning"},
{id:"morning",place:"مقرّ الجمعيّة · الجمعة 09:10",bg:"office",speaker:"الراوي",text:"سامي يدخل للمقرّ. آدم ويوسف يحكيو، وفجأة يسكتوا. يوسف يقلب تلفونو على وجهو. لينا واقفة بحذا الشباك، شادّة دوسييه.",next:"adam"},
{id:"adam",place:"مقرّ الجمعيّة",bg:"office",speaker:"آدم",text:"«صباح الخير يا خويا! آش عملت في البرزنتاسيون؟»\nيوسف يقاطعه: «يلزمنا نبدّلوا شوية أرقام. فما غلطة في الملف اللي حضّرو سامي. الكلّنا يلزمنا نركّزوا أكثر.»",next:"lina2"},
{id:"lina2",place:"مقرّ الجمعيّة",bg:"office",speaker:"لينا",text:"«استنّى يوسف. الحكاية موش بالضبط هكّا.»\nيوسف يبتسم: «حتى حدّ موش يلوم في حدّ، نحبّوا برك نخدموا بالصحيح.»\nآدم ساكت، وسامي يحسّ روحو وحدو.",next:"j2"},

{id:"mail",place:"مقرّ الجمعيّة · 14:30",bg:"office",speaker:"الراوي",text:"يوصلك إيميل بالغالط فيه نسخة قديمة من الجدول. في النسخة الجديدة، فما فرق بـ2400 يورو تحت بند المصاريف. حدّ كتب: «توافق عليه بعد نقاش مع Y».",next:"j3",evidence:"فرق 2400€ بين نسختين؛ ملاحظة فيها الحرف Y، أمّا معناها موش مؤكّد."},
{id:"j3",kind:"judgment",place:"مقرّ الجمعيّة",bg:"office",speaker:"سامي",text:"من جهة، التقرير تبدّل. من جهة أخرى، الحرف Y ينجم يعني يوسف أو حاجة أخرى. المبلغ وحدو ما يثبتش سرقة.",question:"وين تحبّ تمشي تفتّش على الحقيقة؟",choices:[["records","نقارن نسخ الملف وتاريخ التعديلات."],["adam","نحكي مع آدم وحدنا ونسمع منّو."],["youssef","نمشي ليوسف ونسألو مباشرة على الـ2400€."],["rumor","نسأل المتطوّعين شنوة سمعوا على يوسف."]],next:"branch"},
{id:"branch",kind:"branch",place:"مقرّ الجمعيّة",bg:"office",speaker:"الراوي",next:"volunteer"},
{id:"volunteer",place:"في الشارع · 17:20",bg:"street",speaker:"أمينة · متطوّعة",text:"«سمعت اللي يوسف قال عليك ماكش متحكّم في الخدمة. ما نعرفش آش صار بالضبط، أما حبيت نطمن عليك.»\nسامي يوقف. الكلام وصل لناس أخرى.",next:"j4",evidence:"أمينة نقلت كلامًا منسوبًا ليوسف؛ مازال يلزم التثبّت من العبارة والسياق."},
{id:"j4",kind:"judgment",place:"في الشارع",bg:"street",speaker:"الراوي",text:"توّة عندك أفعال ومعلومات ملموسة، أمّا النوايا مازالت غامضة.",question:"شنوّة الفرق بين الحذر وسوء الظنّ في الحالة هاذي؟",choices:[["boundary","نوقّف إرسال التقرير حتى نفهم الحسابات، من غير ما نتّهم حدّ."],["trust","يوسف معروف ومتديّن؛ مستحيل يعمل حاجة خايبة."],["guilty","واضح اللي يوسف يتلاعب، ماعادش نحتاج دليل آخر."],["verify","نطلب توضيح رسمي ونسجّل شنوّة نعرف وشنوّة ما نعرفش."]],next:"adamtruth"},
{id:"adamtruth",place:"قهوة الحومة · السبت 18:00",bg:"cafe",speaker:"آدم",text:"«إي، كنت نعرف اللي ثمّة تعديل في التقرير. وما قلتلكش. خويا الصغير يستحقّ إعانة من الجمعية، وخفت إذا نعمل مشكلة نقصّ عليه فرصة المساعدة.»\nيسكّت ويكمّل: «ما عنديش عذر. أما ما كنتش نحبّ نضرّك.»",next:"j5",evidence:"آدم أقرّ أنّه عرف بالتعديل وسكت خوفًا على مصلحة خوّه."},
{id:"j5",kind:"judgment",place:"قهوة الحومة",bg:"cafe",speaker:"سامي",text:"تحسّ بالغصّة. توّة عرفت علاش سكت. أما سكوتو ضرّك بالفعل.",question:"شنوّة تقول لآدم؟",choices:[["forgive","«نفهم خوفك. نسامحك، أما يلزمنا نصلحوا اللي صار.»"],["limit","«نتفهّم وضعك، أما الثقة ترجع بالأفعال، موش بالكلام.»"],["cut","«حتى لو عندك سبب، ما عادش نحب نحكي معاك.»"],["silence","«نحتاج وقت باش نفكّر، وما نحبّش نحكم توّة.»"]],next:"sister"},
{id:"sister",place:"دار سامي · السبت 21:05",bg:"mirror",speaker:"مريم · أخت سامي",text:"«سامي، البارح بعثتلك وقلقت عليك. شفتك أونلاين وما جاوبتنيش. حسّيت اللي ماكش تحب تسمعني.»\nسامي يتفكّر اللي كان تعبان ومضغوط، وشاف الميساج ونوى يجاوب بعد... ونسى.",next:"j6"},
{id:"j6",kind:"judgment",place:"دار سامي",bg:"mirror",speaker:"الراوي",text:"نفس الحركة تقريبًا: ميساج تقرى وما يجيش الردّ. هالمرّة تعرف الظروف خاطر عشتها إنت.",question:"شنوّة تحبّ تقول لمريم؟",choices:[["explain","«سامحني. كنت مضغوط ونسيت، أما نفهم علاش تقلّقت.»"],["defend","«موش لازم تفسّري كلّ سكوت على أنّه رفض.»"],["dismiss","«كبرت الموضوع برشا، ما فيها حتى شيء.»"],["listen","«قبل ما نفسّرلك، نحب نفهم كيفاش عشتِ الموقف.»"]],next:"linaTruth"},
{id:"linaTruth",place:"مقرّ الجمعيّة · الأحد 10:00",bg:"office",speaker:"لينا",text:"«لقيت اللي الـ2400€ تنقلوا من بند لبند آخر بسبب طلب من المموّل، أما التغيير ما توثّقش كما يلزم. يوسف وافق على التغيير، والتصرف في الملف كان غالط. ما لقيتش دليل أنّ فلوس اختفت.»",next:"last",evidence:"التعديلات كانت إعادة تصنيف غير موثّقة كما يلزم؛ لا يوجد في الأدلة المتاحة ما يثبت اختلاسًا."},
{id:"last",kind:"judgment",place:"مقرّ الجمعيّة",bg:"office",speaker:"الراوي",text:"بعض شكوكك كان عندها أساس، وبعض التفسيرات زادت على الموجود. مازال لازم تتصلّح مسؤوليات وممارسات، حتى من غير دليل على سرقة.",question:"شنوّة الموقف النهائي اللي تختارو؟",choices:[["accountable","نطلب تصحيحًا مكتوبًا للأرقام والكلام اللي اتقال، من غير اتهامات على النوايا."],["drop","نطوي الصفحة الكلّ، بما أنّه ما فماش سرقة مثبتة."],["publish","نفضح يوسف قدّام الناس الكلّ قبل ما نكمّل التثبّت."],["talk","نحكي مع الأطراف المعنية ونثبت الوقائع، وبعد نقرّر كيفاش نصلّح الضرر."]],next:"ending"}
];

document.getElementById("progress").firstElementChild.style.width=(Math.min(100,Math.round((scenes.findIndex(v=>v.id===state.id)+1)/scenes.length*100)))+"%";
if(state.id==="ending"){renderEnding();return}
if(!s){go("intro");return}
if(s.kind==="branch"){const route=state.answers.j3?.value;const texts={records:"فتّشت في تاريخ التعديلات: ثمّة تعديل بتاريخ واضح، أما سبب التعديل موش مكتوب.",adam:"آدم حاول يتهرّب من الإجابة، وبعد وافق يحكي معاك وحدك.",youssef:"يوسف قال إنّ التعديل إداري وطلب منك تستنّى النسخة المراجَعة.",rumor:"سمعت حكايات مختلفة، أما أغلبها منقولة وما فيهاش مصدر مباشر."};app.innerHTML=stage(s)+'<div class="dialog"><div class="speaker">الراوي</div><div class="line">'+escapeHtml(texts[route]||texts.records)+'</div><div class="hint">ما كلّ معلومة تسمعها دليل بنفس القوّة.</div></div><div class="panel"><button class="primary" id="go">نكمل ←</button></div>';document.getElementById("go").onclick=()=>next(s);return}
let html=stage(s)+'<div class="dialog"><div class="speaker">'+escapeHtml(s.speaker)+'</div><div class="line">'+escapeHtml(s.text)+'</div><div class="hint">'+(s.kind==="judgment"?"قرّر على قدّ المعطيات اللي عندك.":"اضغط باش تكمّل الحكاية.")+'</div></div>';
if(s.kind==="judgment"){
 const selected=state.answers[s.id];html+='<div class="panel"><div class="question">'+escapeHtml(s.question)+'</div><div class="options">'+s.choices.map(x=>'<button class="choice" data-choice="'+x[0]+'" aria-pressed="'+(selected?.value===x[0])+'" style="'+(selected?.value===x[0]?'border-color:#d4ae70;background:#263549;':'')+'">'+escapeHtml(x[1])+'</button>').join("")+'</div><div class="meta"><span>قدّاش إنت واثق؟</span><input id="confidence" aria-label="نسبة الثقة" type="range" min="0" max="100" step="5" value="'+(selected?.confidence??60)+'"><strong id="confval">'+(selected?.confidence??60)+'%</strong></div><button class="primary" id="confirm" '+(!selected?"disabled":"")+'>نثبّت رايي ونكمّل ←</button><p class="notes">تنجم تبدّل رايك قبل ما تثبّتو. ما فماش «نقطة إيمان» ولا إجابة محفوظة.</p></div>';
}else{html+='<div class="panel"><button class="primary" id="go">نكمل الحكاية ←</button></div>'}
app.innerHTML=html;
if(s.kind==="judgment"){
 let choice=selected?.value||"",conf=selected?.confidence??60;
 document.querySelectorAll("[data-choice]").forEach(el=>el.onclick=()=>{choice=el.dataset.choice;document.querySelectorAll("[data-choice]").forEach(e=>{e.style.borderColor=e===el?"#d4ae70":"#35475c";e.style.background=e===el?"#263549":"#152339";e.setAttribute("aria-pressed",e===el?"true":"false")});document.getElementById("confirm").disabled=false});
 const slider=document.getElementById("confidence");slider.oninput=()=>{conf=+slider.value;document.getElementById("confval").textContent=conf+"%"};
 document.getElementById("confirm").onclick=()=>{if(!choice)return;state.answers[s.id]={value:choice,confidence:conf,question:s.question,selected:s.choices.find(v=>v[0]===choice)[1]};save();next(s)};
}else document.getElementById("go").onclick=()=>next(s);
}
function score(){
 const a=state.answers;let evidence=0,care=0,action=0,certainty=0,updates=0;
 const maps={j1:{exclude:[-1,-1,0],careless:[1,1,0],report:[1,0,1],unknown:[2,1,0]},j2:{accuse:[-1,-1,2],clarify:[2,1,1],withdraw:[0,0,-1],check:[2,1,1]},j3:{records:[2,1,1],adam:[1,2,1],youssef:[1,1,2],rumor:[-1,-1,1]},j4:{boundary:[2,2,2],trust:[-1,-1,0],guilty:[-2,-2,2],verify:[2,2,1]},j5:{forgive:[1,2,1],limit:[2,2,2],cut:[0,-1,2],silence:[1,1,0]},j6:{explain:[2,2,2],defend:[0,0,1],dismiss:[-1,-2,1],listen:[2,2,1]},last:{accountable:[2,2,2],drop:[-1,0,0],publish:[-2,-2,2],talk:[2,2,1]}};
 Object.entries(a).forEach(([id,v])=>{const x=maps[id]?.[v.value]||[0,0,0];evidence+=x[0];care+=x[1];action+=x[2];certainty+=v.confidence});
 const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
 return {evidence:clamp(50+evidence*5),care:clamp(50+care*5),action:clamp(40+action*6),confidence:clamp(certainty/Math.max(1,Object.keys(a).length)),updates};
}
function renderEnding(){
 const x=score();const a=state.answers;
 const type=x.evidence>=70&&x.care>=65?"المتثبّت المتفهّم":x.action>=75?"المبادر":x.care>=70?"السامع للناس":"الباحث على المعنى";
 let html='<div class="intro endtitle"><div class="tag">نهاية الحلقة التجريبية</div><h1>طبقات الحقيقة</h1><p>الحقيقة موش ديما كيفاش تخيّلناها. والنية ما ننجموش نشوفوها بعينينا.</p><h2>'+type+'</h2><p>هذا وصف اختياراتك داخل اللعبة برك، موش تصنيف شخصية علمي ولا حكم على دينك.</p></div>';
 html+='<div class="card"><h2>شنوّة بان من اختياراتك؟</h2>'+[['التثبّت من الدليل',x.evidence],['الفصل بين الفعل والنيّة',x.care],['القدرة على التصرّف',x.action]].map(z=>'<div>'+z[0]+' · '+z[1]+'%<div class="resultbar"><span style="width:'+z[1]+'%"></span></div></div>').join("")+'<p class="notes">النسب مؤشرات سردية تجريبية، موش مقياس نفسي مُثبت.</p></div>';
 html+='<div class="card"><h2>الحقيقة اللي عرفناها</h2><p>الأرقام تبدّلت بطريقة غير موثّقة مليح. آدم سكت خوفًا على مصلحة خوّه. لينا حبّت تتثبّت قبل ما تتّهم. ما ظهرش دليل على اختلاس، أما هذا ما يلغيّش مسؤولية تصحيح التقرير والكلام اللي تسبّب في ضرر.</p><p>يوسف زادة يتحمّل مسؤولية الطريقة اللي قدّم بيها الموضوع، حتّى كان قصدو موش محسوم.</p></div>';
 html+='<div class="card"><h2>حُسن الظنّ وسوء الظنّ</h2><p style="font-size:20px;color:#eacb97">«اجْتَنِبُوا كَثِيرًا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ»</p><p class="notes">سورة الحجرات، الآية 12 (مقتطف). المعنى اللي تفتحو القصة: ما تزيدش على الوقائع حكم على قلوب الناس، وأيضًا ما تتغافلش على دليل واضح. التفصيل الشرعي يرجع للتفسير المعتمد والعلماء.</p></div>';
 html+='<div class="card"><h2>المراية</h2><p>كيف آدم ما جاوبش على ميساج سامي، شنوّة خمّمت؟ وكيف سامي ما جاوبش على مريم، هل فسّرت نفس التصرف بنفس الطريقة؟</p><p class="notes">السؤال موش باش يلومك. باش يخلّيك تشوف الفرق بين اللي نعرفوه على رواحنا واللي ما نعرفوهش على الناس.</p></div>';
 html+='<div class="panel"><button class="primary" id="again">نعاود نلعب باختيارات أخرى ↺</button> <button class="mini" id="openNotes">نشوف الدفتر والقرارات</button></div>';
 document.getElementById("app").innerHTML=html;document.getElementById("progress").firstElementChild.style.width="100%";
 document.getElementById("again").onclick=reset;document.getElementById("openNotes").onclick=journal;
}
function journal(){
 const el=document.getElementById("overlay");let html='<div class="overlay"><div class="modal"><button class="close" id="close">✕ سكّر</button><h2>◈ دفتر الحقيقة</h2><p class="notes">باش تفرّق بين المعلومة اللي وصلتك والتفسير اللي عطيتو إنت.</p><h3>الحاجات اللي ثبتت في الحكاية</h3>';
 html+=(state.evidence.length?state.evidence.map(e=>'<div class="journal-item">✦ '+escapeHtml(e)+'</div>').join(""):'<p class="notes">مازلت ما جمّعت حتى معلومة.</p>');
 html+='<h3>أحكامك ودرجة الثقة</h3>';
 html+=(Object.entries(state.answers).length?Object.entries(state.answers).map(([id,a])=>'<div class="journal-item"><strong>'+escapeHtml(a.question)+'</strong><div>'+escapeHtml(a.selected)+'</div><small>الثقة: '+a.confidence+'%</small></div>').join(""):'<p class="notes">مازلت ما عملت حتى قرار.</p>');
 html+='</div></div>';el.hidden=false;el.innerHTML=html;document.getElementById("close").onclick=()=>{el.hidden=true;el.innerHTML=""};
}
function reset(){if(!confirm("تحبّ ترجع من اللول؟ القرارات القديمة باش تتمسح."))return;state={id:"intro",answers:{},evidence:[],steps:0,music:state.music};save();render()}
function musicToggle(){
 if(state.music){if(gain)gain.gain.setTargetAtTime(0,audioCtx.currentTime,.2);state.music=false}
 else{try{if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();gain=audioCtx.createGain();gain.gain.value=0;gain.connect(audioCtx.destination);[110,164.81,220,329.63].forEach((f,i)=>{const o=audioCtx.createOscillator();o.type="sine";o.frequency.value=f;const g=audioCtx.createGain();g.gain.value=i===0?.25:.07;o.connect(g);g.connect(gain);o.start();osc.push(o)})}audioCtx.resume();gain.gain.setTargetAtTime(.10,audioCtx.currentTime,.5);state.music=true}catch(e){alert("المتصفح ما يدعمش الصوت في الوضع هذا.")}}
 save();render()
}
document.getElementById("music").onclick=musicToggle;
document.getElementById("journalBtn").onclick=journal;
document.getElementById("restart").onclick=reset;
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.classList.contains("overlay"))e.currentTarget.hidden=true});
render();
})();
</script>
</body></html>
